--normalize<equal>no=Normalize html, script, and text files. Use normalize=no for yara compatibility
--scan-pe<equal>yes=Scan PE files
--scan-pe<equal>no=Scan PE files
--scan-elf<equal>yes=Scan ELF files
--scan-elf<equal>no=Scan ELF files
--scan-ole2<equal>yes=Scan OLE2 containers
--scan-ole2<equal>no=Scan OLE2 containers
--scan-pdf<equal>yes=Scan PDF files
--scan-pdf<equal>no=Scan PDF files
--scan-swf<equal>yes=Scan SWF files
--scan-swf<equal>no=Scan SWF files
