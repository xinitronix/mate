[Directories]
LoadSupportedDBFiles=checked|/var/db/clamav
TmpFile=checked|/tmp
ScanReportToFile=checked|/home/definitly/.clamav-gui/logs/report-scan.log
MoveInfectedFiles=not checked|/home/definitly/.clamav-gui/quarantine
CopyInfectedFiles=not checked|/home/definitly/.clamav-gui/quarantine
ScanFilesFromFile=not checked|
FollowDirectorySymLinks=not checked|0
FollowFileSymLinks=not checked|0

[Setup]
language=2

[Settings]
ShowHiddenDirs=false
ShowHideMainWindow=false
SudoGUI=/usr/local/bin/pkexec<!nl>
Directories=/

[FreshClam]
runasroot=false
UpdatesPerDay=12
DataBaseToUpdate=0

[Freshclam]
StartDaemon=false

[Clamd]
ClamdPid=n/a
Status=not running
ClamdScanMultithreading=0
ClamdLocation=/usr/local/sbin/clamd
ClamonaccLocation=n/a

[FreshclamSettings]
FreshclamLocation=/usr/local/bin/freshclam

[Updater]
Version= Scanner 1.4.1

[OtherKeywords]
--help=exists
--version=exists
--tempdir=exists
--database=exists
--fail-if-cvd-older-than=exists
--log=exists
--follow-dir-symlinks=exists
--follow-file-symlinks=exists
--file-list=exists
--move=exists
--copy=exists
--exclude=exists
--exclude-dir=exists
--include=exists
--include-dir=exists
--bytecode=exists
--bytecode-timeout=exists
--statistics=exists
--exclude-pua=exists
--include-pua=exists
--structured-ssn-format=exists
--structured-ssn-count=exists
--structured-cc-count=exists
--structured-cc-mode=exists
--max-scantime=exists
--max-filesize=exists
--max-scansize=exists
--max-files=exists
--max-recursion=exists
--max-dir-recursion=exists
--max-embeddedpe=exists
--max-htmlnormalize=exists
--max-htmlnotags=exists
--max-scriptnormalize=exists
--max-ziptypercg=exists
--max-partitions=exists
--max-iconspe=exists
--max-rechwp3=exists
--pcre-match-limit=exists
--pcre-recmatch-limit=exists
--pcre-max-filesize=exists

[AvailableOptions]
--verbose=Be verbose
--archive-verbose=Show filenames inside scanned archives
--debug=Enable libclamav's debug messages
--quiet=Only output error messages
--stdout=Write to stdout instead of stderr. Does not affect 'debug' messages.
--no-summary=Disable summary at end of scanning
--infected=Only print infected files
--suppress-ok-results=Skip printing OK files
--bell=Sound bell on virus detection
--leave-temps<equal>no=Do not remove temporary files
--leave-temps<equal>yes=Do not remove temporary files
--force-to-disk<equal>no=Create temporary files for nested file scans that would otherwise be in-memory only
--force-to-disk<equal>yes=Create temporary files for nested file scans that would otherwise be in-memory only
--gen-json<equal>no=Generate JSON metadata for the scanned file(s). For testing & development use ONLY.
--gen-json<equal>yes=Generate JSON metadata for the scanned file(s). For testing & development use ONLY.
--official-db-only<equal>no=Only load official signatures
--official-db-only<equal>yes=Only load official signatures
--recursive<equal>no=Scan subdirectories recursively
--recursive<equal>yes=Scan subdirectories recursively
--allmatch<equal>no=Continue scanning within file after finding a match
--allmatch<equal>yes=Continue scanning within file after finding a match
--cross-fs<equal>yes=Scan files and directories on other filesystems
--cross-fs<equal>no=Scan files and directories on other filesystems
--remove<equal>no=Remove infected files. Be careful!
--remove<equal>yes=Remove infected files. Be careful!
--bytecode-unsigned<equal>no=Load unsigned bytecode
--bytecode-unsigned<equal>yes=Load unsigned bytecode
--detect-pua<equal>no=Detect Possibly Unwanted Applications
--detect-pua<equal>yes=Detect Possibly Unwanted Applications
--detect-structured<equal>no=Detect structured data (SSN, Credit Card)
--detect-structured<equal>yes=Detect structured data (SSN, Credit Card)
--scan-mail<equal>yes=Scan mail files
--scan-mail<equal>no=Scan mail files
